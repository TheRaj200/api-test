# PostgreSQL settings for a 1 vCPU / 1 GB RAM box running api-test.
# Append to postgresql.conf (or drop into conf.d/) and restart.
#
# Memory budget: shared_buffers 192 MB + ~100 MB backends + OS + the Go
# binary (~25 MB) leaves a few hundred MB of headroom for page cache.

listen_addresses = 'localhost'
port = 5432
max_connections = 20            # >= DB_MAX_OPEN_CONNS + room for psql/pg_dump
shared_buffers = 192MB
effective_cache_size = 512MB
work_mem = 4MB                  # per sort/hash; keep small with few cores
maintenance_work_mem = 48MB
wal_buffers = 8MB
min_wal_size = 64MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1          # SSD/VPS block storage
effective_io_concurrency = 200
wal_compression = on

# Durability. Leave 'on' for real orders: every COMMIT is one fsync.
# 'off' removes the per-order fsync (much higher write throughput) but the
# last few hundred milliseconds of committed orders can be lost on a crash.
synchronous_commit = on

# Log slow queries so the next bottleneck is visible.
log_min_duration_statement = 200ms
log_line_prefix = '%m [%p] '
